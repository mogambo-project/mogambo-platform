# Loki — log store. Chart values from observability/loki-values.yaml via $values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/observability/loki-values.yaml
    - repoURL: https://github.com/mogambo-project/mogambo-platform.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true          # so the disabled memcached caches are actually removed, not left running
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
