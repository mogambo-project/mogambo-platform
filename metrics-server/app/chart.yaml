# metrics-server — serves pod/node CPU+memory via the metrics.k8s.io API. Required by the HPA
# objects the shared chart renders (and by `kubectl top`).
#   Was:  day-0  kubectl apply components.yaml  +  a kubelet-insecure-tls patch
#   Now:  Argo CD installs it; the insecure-tls flag is a values arg, not a kubectl patch.
# (kind kubelets use self-signed certs, so metrics-server must skip kubelet cert verification.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.13.1
    helm:
      releaseName: metrics-server
      values: |
        args:
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
