# Headlamp — cluster web console (Helm chart). Bump targetRevision + push to upgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.44.0
    helm:
      releaseName: headlamp            # match the old release name → clean adopt
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  # The chart sets `hostUsers: true` on the pod spec, but kind's kubelet strips the field (the
  # UserNamespacesSupport feature gate is off), so it never persists — leaving ArgoCD comparing a
  # desired field the cluster always drops → permanent OutOfSync that a sync can't resolve. Ignore it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: headlamp
      jsonPointers:
        - /spec/template/spec/hostUsers
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
